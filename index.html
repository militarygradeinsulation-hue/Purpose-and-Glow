    <script>
      // Suppress development WebSocket/HMR disconnect errors in AI Studio iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          ((typeof event.reason.message === 'string' &&
            (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite:ws'))) ||
            (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      });
    </script>
